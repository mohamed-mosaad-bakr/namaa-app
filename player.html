<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Namaa player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;inset:0;width:100%;height:100%}</style></head>
<body><div id="p"></div>
<script>
/* Namaa YouTube relay: the app (file:// in the Android WebView) embeds this https page, so YouTube gets a valid referrer. Talks to the parent with postMessage. */
(function(){
var q={};try{q=JSON.parse(decodeURIComponent(location.hash.slice(1))||'{}');}catch(e){}
var P=null,tick=null;function send(m){try{m.nmyt=1;parent.postMessage(m,'*');}catch(e){}}
function info(){try{return{t:P.getCurrentTime(),d:P.getDuration()};}catch(e){return{t:0,d:0};}}
window.onYouTubeIframeAPIReady=function(){
 if(q.count&&q.list){/* count mode: Namaa asks how many episodes a playlist has (no playback) */
  var n=0,done=false;function fin(ids){if(done)return;done=true;send({ev:'pl',list:q.list,ids:ids||[]});}
  P=new YT.Player('p',{width:'200',height:'200',host:'https://www.youtube.com',playerVars:{listType:'playlist',list:q.list,origin:location.origin},events:{
   onReady:function(){var t=setInterval(function(){var ids=null;try{ids=P.getPlaylist();}catch(e){}if(ids&&ids.length){clearInterval(t);fin(ids);}else if(++n>40){clearInterval(t);fin(null);}},250);},
   onError:function(e){send({ev:'error',code:e.data,list:q.list});fin(null);}}});return;}
var pv=q.pv||{};pv.playsinline=1;pv.origin=location.origin;pv.rel=0;
 var o={width:'100%',height:'100%',host:'https://www.youtube.com',playerVars:pv,events:{
  onReady:function(){var i=info();send({ev:'ready',d:i.d});},
  onStateChange:function(e){var i=info();send({ev:'state',s:e.data,t:i.t,d:i.d});clearInterval(tick);if(e.data===1)tick=setInterval(function(){var j=info();send({ev:'time',t:j.t,d:j.d});},2000);},
  onError:function(e){send({ev:'error',code:e.data});}}};
 if(q.list){pv.listType='playlist';pv.list=q.list;}else o.videoId=q.v;
 P=new YT.Player('p',o);};
window.addEventListener('message',function(e){var d=e.data||{};if(!P||!d.nmcmd)return;try{if(d.nmcmd==='pause')P.pauseVideo();if(d.nmcmd==='seek')P.seekTo(d.t,true);}catch(x){}});
var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=function(){send({ev:'error',code:'api'});};document.head.appendChild(s);
})();
</script></body></html>
